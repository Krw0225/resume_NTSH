<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字典查詢</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            transition: background-color 0.4s ease;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            transition: background-color 0.4s ease;
        }

        /* ===== 韓文模式 (藍色系) ===== */
        body.lang-ko {
            background-color: #e8f4f8;
        }
        body.lang-ko header {
            background-color: #2196F3;
        }

        /* ===== 日文模式 (粉色系) ===== */
        body.lang-ja {
            background-color: #fce4ec;
        }
        body.lang-ja header {
            background-color: #E91E63;
        }

        section {
            margin: 20px;
        }
        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="{% if target_lang == 'ja' %}lang-ja{% else %}lang-ko{% endif %}">
    <header>
        <h1>字典</h1>
    </header>
    <section>
        <div class="form-box">
            <!-- 加上 id="transForm" 方便 JS 操控 -->
            <form id="transForm" action="/ask" method="post">
                <label for="question">中文:</label><br>
                <input type="text" id="question" name="question" value="{{ question }}"><br><br>
                
                <label for="answer" id="answerLabel">
                    {% if target_lang == 'ja' %}日文{% else %}韓文{% endif %}:
                </label><br>
                <input type="text" id="answer" name="answer" readonly value="{{ answer }}"><br><br>
                
                <!-- 隱藏欄位紀錄目標語言 -->
                <input type="hidden" id="target_lang" name="target_lang" value="{{ target_lang if target_lang else 'ko' }}">
                
                <!-- 改為 type="button"，完全由 JS 判斷處理 -->
                <button type="button" onclick="submitTranslation('ko')">中翻韓</button>
                <button type="button" onclick="submitTranslation('ja')">中翻日</button>
                <input type="button" value="回首頁" onclick="window.location.href='/'">
            </form>
        </div>
    </section>

    <script>
        function submitTranslation(lang) {
            var questionInput = document.getElementById('question').value.trim();
            var answerInput = document.getElementById('answer');
            var answerLabel = document.getElementById('answerLabel');
            var targetLangInput = document.getElementById('target_lang');

            // 1. 切換頁面顏色與標籤
            targetLangInput.value = lang;
            if (lang === 'ja') {
                document.body.className = 'lang-ja';
                answerLabel.innerText = '日文:';
            } else {
                document.body.className = 'lang-ko';
                answerLabel.innerText = '韓文:';
            }

            // 2. 判斷是否有輸入文字
            if (questionInput === '') {
                // 若未輸入文字：不送出表單，直接填入提示訊息，避免出現「抱歉...」
                answerInput.value = '請輸入要查詢的中文單字。';
            } else {
                // 有輸入文字：送出表單進行字典查詢
                document.getElementById('transForm').submit();
            }
        }
    </script>
</body>
</html>
