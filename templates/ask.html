<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            /* 加入背景顏色切換的平滑過渡效果 */
            transition: background-color 0.4s ease;
        }

        /* 韓文模式背景色 (淺藍) */
        body.lang-ko {
            background-color: #e8f4f8;
        }

        /* 日文模式背景色 (淺粉) */
        body.lang-ja {
            background-color: #fce4ec;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
        }
        section {
            margin: 20px;
        }
        .form-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<!-- 透過 Jinja2 判斷，在頁面載入時自動設定對應的背景色 class -->
<body class="{% if target_lang == 'ja' %}lang-ja{% else %}lang-ko{% endif %}">
    <header>
        <h1>字典</h1>
    </header>
    <section>
        <div class="form-box">
            <form action="/ask" method="post">
                <label for="question">中文:</label><br>
                <input type="text" id="question" name="question" value="{{ question }}"><br><br>
                
                <!-- 動態顯示目前語言名稱（韓文 / 日文） -->
                <label for="answer">
                    {% if target_lang == 'ja' %}日文{% else %}韓文{% endif %}:
                </label><br>
                <input type="text" id="answer" name="answer" readonly value="{{ answer }}"><br><br>
                
                <!-- 點擊時透過 onclick 觸發 JavaScript 切換背景顏色 -->
                <button type="submit" name="target_lang" value="ko" onclick="changeBg('ko')">中翻韓</button>
                <button type="submit" name="target_lang" value="ja" onclick="changeBg('ja')">中翻日</button>
                <input type="button" value="回首頁" onclick="window.location.href='/'">
            </form>
        </div>
    </section>

    <script>
        function changeBg(lang) {
            if (lang === 'ja') {
                document.body.className = 'lang-ja';
            } else {
                document.body.className = 'lang-ko';
            }
        }
    </script>
</body>
</html>
